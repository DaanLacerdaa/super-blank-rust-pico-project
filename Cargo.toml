[package]
name = "super-blank-project"
version = "0.2.0"
edition = "2021"
readme = "README.md"

[dependencies]
rp2040-hal = "0.11.0"
rtic = { version = "2.1.2", features = ["cortex-m"] }
panic-halt = "1.0.0"
embedded-hal = "1.0.0"
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
rp2040-boot2 = "0.2.1"
embedded-time = "0.12.1"
defmt = { version = "0.3.10" }

[target.thumbv6m-none-eabi]
runner = "probe-run --chip RP2040"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "s"

[[bin]]
name = "blinky"
path = "blink.rs"
