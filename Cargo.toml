[package]
name = "super-blank-project"
version = "0.2.0"
edition = "2021" # Recomendado para projetos atuais

[dependencies]
# HAL para Raspberry Pi Pico
rp2040-hal = "0.7.0"

rtic = "2.0.0"  # ou a versão compatível

# Gerenciador de panics para dispositivos embarcados
panic-halt = "0.2.0"

# Definições de HAL embarcado
embedded-hal = { version = "0.2.5", features = ["unproven"] }

# Suporte para ARM Cortex-M
cortex-m = "0.7.2"
cortex-m-rt = "0.7"

# Bootloader para Raspberry Pi Pico
rp2040-boot2 = "0.2.1"

# Ferramentas adicionais para manipulação de atraso e GPIOs
embedded-time = "0.12.1"

[build-dependencies]
# Compilação de código específico do chip
cortex-m-rtic = "0.5.8"

[target.thumbv6m-none-eabi]
# Ferramenta para executar o código no chip
runner = "probe-run --chip RP2040"

[profile.dev]
# Otimizações específicas para depuração
opt-level = "z"

[profile.release]
# Otimizações para binários de produção
opt-level = "s"


[[bin]]
# Configuração para o binário principal
name = "blinky"
path = "blinky.rs"
