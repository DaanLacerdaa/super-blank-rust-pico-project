[package]
name = "super-blank-project"
version = "0.2.0"
edition = "2021"

[dependencies]
rp2040-hal = "0.11.0"
rtic = { version = "2.1.2", features = ["cortex-m"] }
panic-halt = "0.2.0"
embedded-hal = "1.0.0"
cortex-m = "0.7.2"
cortex-m-rt = "0.7"
rp2040-boot2 = "0.2.1"
embedded-time = "0.12.1"
defmt = { version = "0.3.10" }
cortex-m-rtic = "1.1.4"

[build-dependencies]
cortex-m-rtic = { version = "1.1.4" }

[target.thumbv6m-none-eabi]
runner = "probe-run --chip RP2040"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "s"

[[bin]]
name = "blinky"
path = "blink.rs"
